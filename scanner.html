<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MÆDNESS® — SCANNER</title>

  <style>
    :root {
      --red: #ff0000;
      --black: #050505;
      --white: #ffffff;
      --green: #20d878;
      --orange: #ff9d00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100svh;
      padding: 18px;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      min-height: calc(100svh - 36px);
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================
       TOP
       ========================================================== */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 26px;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .brand span {
      font-size: 11px;
      vertical-align: top;
      margin-left: 2px;
    }

    .top-label {
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: right;
      line-height: 1.4;
    }

    /* ==========================================================
       TITLE
       ========================================================== */

    .title {
      margin: 0 0 8px;
      font-size: clamp(54px, 17vw, 92px);
      line-height: 0.84;
      letter-spacing: -0.07em;
      font-weight: 900;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    /* ==========================================================
       PARTICIPANT STATS
       ========================================================== */

    .participant-stats {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin: 0 0 22px;
      padding: 12px 0;
      border-top: 1px solid #292929;
      border-bottom: 1px solid #292929;
    }

    .participant-stats-label {
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .participant-stats-number {
      color: var(--white);
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .participant-stats-caption {
      color: var(--red);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    /* ==========================================================
       AUDIO
       ========================================================== */

    .audio-button {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      border: 1px solid var(--red);
      background: var(--black);
      color: var(--white);
      padding: 10px 14px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
      cursor: pointer;
      display: none;
    }

    .audio-button.visible {
      display: block;
    }

    .audio-button.enabled {
      color: var(--green);
      border-color: var(--green);
    }

    /* ==========================================================
       SCANNER
       ========================================================== */

    .scanner-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      overflow: hidden;
      border: 1px solid #292929;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #reader__scan_region {
      width: 100% !important;
      min-height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    .scan-corners {
      position: absolute;
      inset: 12%;
      pointer-events: none;
      z-index: 10;
    }

    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: var(--red);
      border-style: solid;
    }

    .corner.tl {
      top: 0;
      left: 0;
      border-width: 3px 0 0 3px;
    }

    .corner.tr {
      top: 0;
      right: 0;
      border-width: 3px 3px 0 0;
    }

    .corner.bl {
      bottom: 0;
      left: 0;
      border-width: 0 0 3px 3px;
    }

    .corner.br {
      bottom: 0;
      right: 0;
      border-width: 0 3px 3px 0;
    }

    .scan-line {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 50%;
      height: 2px;
      background: var(--red);
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
      opacity: 0.85;
      z-index: 11;
      pointer-events: none;
      animation: scan 1.8s ease-in-out infinite;
    }

    @keyframes scan {
      0%,
      100% {
        transform: translateY(-100px);
      }

      50% {
        transform: translateY(100px);
      }
    }

    .scanner-status {
      margin-top: 10px;
      color: #777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .loading {
      display: none;
      margin-top: 14px;
      color: var(--white);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .loading.visible {
      display: block;
    }

    /* ==========================================================
       RESULT
       ========================================================== */

    .result {
      display: none;
      margin-top: 18px;
      border: 1px solid #292929;
      padding: 20px;
    }

    .result.visible {
      display: block;
    }

    .result.valid {
      border-color: var(--green);
    }

    .result.already {
      border-color: var(--orange);
    }

    .result.invalid {
      border-color: var(--red);
    }

    .result-code {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }

    .result.valid .result-code {
      color: var(--green);
    }

    .result.already .result-code {
      color: var(--orange);
    }

    .result.invalid .result-code {
      color: var(--red);
    }

    .participant {
      font-size: clamp(28px, 8vw, 44px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    .details {
      color: #aaa;
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .details strong {
      color: var(--white);
    }

    .reset-button {
      width: 100%;
      height: 48px;
      margin-top: 18px;
      border: 0;
      background: var(--red);
      color: var(--white);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    /* ==========================================================
       SEARCH
       ========================================================== */

    .search-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #292929;
    }

    .search-label {
      display: block;
      margin-bottom: 10px;
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #292929;
      outline: none;
      background: #000;
      color: var(--white);
      padding: 0 13px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 0;
    }

    .search-input::placeholder {
      color: #555;
    }

    .search-input:focus {
      border-color: var(--red);
    }

    .search-button {
      width: 92px;
      height: 46px;
      border: 1px solid var(--red);
      background: var(--red);
      color: var(--white);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    .search-status {
      min-height: 16px;
      margin-top: 9px;
      color: #666;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .search-results {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .search-item {
      border: 1px solid #292929;
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .search-item-name {
      min-width: 0;
      color: var(--white);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .search-item-right {
      flex-shrink: 0;
      text-align: right;
    }

    .search-item-status {
      color: var(--green);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .search-item-status.used {
      color: var(--orange);
    }

    .search-item-time {
      margin-top: 4px;
      color: #666;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .search-empty {
      padding: 14px 0;
      color: #555;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ==========================================================
       FOOTER
       ========================================================== */

    .footer {
      margin-top: auto;
      padding-top: 30px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #444;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    @media (max-width: 380px) {

      body {
        padding: 14px;
      }

      .page {
        min-height: calc(100svh - 28px);
      }

      .participant-stats {
        gap: 7px;
      }

      .participant-stats-number {
        font-size: 20px;
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <header class="top">

  <!-- QR SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>


  <script>

    /*
     * ==========================================================
     * SUPABASE
     * ==========================================================
     */

    const SUPABASE_URL =
      "https://rmniojqexlasxfxisqbm.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_SbqTxagdWxbf9QjnMzKQsg_E_aCGvm-";


    const RPC_URL =
      `${SUPABASE_URL}/rest/v1/rpc/check_ticket`;


    const SEARCH_RPC_URL =
      `${SUPABASE_URL}/rest/v1/rpc/search_participants`;


    const STATS_RPC_URL =
      `${SUPABASE_URL}/rest/v1/rpc/get_participant_stats`;


    /*
     * ==========================================================
     * ELEMENTI
     * ==========================================================
     */

    const scannerStatus =
      document.getElementById(
        "scannerStatus"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const result =
      document.getElementById(
        "result"
      );


    const resultCode =
      document.getElementById(
        "resultCode"
      );


    const participant =
      document.getElementById(
        "participant"
      );


    const details =
      document.getElementById(
        "details"
      );


    const resetButton =
      document.getElementById(
        "resetButton"
      );


    const audioButton =
      document.getElementById(
        "audioButton"
      );


    const participantStats =
      document.getElementById(
        "participantStats"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    const searchStatus =
      document.getElementById(
        "searchStatus"
      );


    const searchResults =
      document.getElementById(
        "searchResults"
      );


    /*
     * ==========================================================
     * SCANNER STATE
     * ==========================================================
     */

    let html5QrCode = null;

    let scannerRunning = false;

    let requestInProgress = false;


    /*
     * Ultimo QR elaborato.
     *
     * Rimane bloccato per evitare che lo stesso
     * QR davanti alla camera venga inviato
     * continuamente al database.
     */

    let lastScannedToken = "";

    let lastScanTime = 0;

    const SAME_QR_COOLDOWN = 3500;


    /*
     * ==========================================================
     * AUDIO STATE
     * ==========================================================
     */

    let audioContext = null;

    let audioEnabled = false;


    /*
     * ==========================================================
     * AUDIO INIT
     * ==========================================================
     */

    function enableAudio() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        gain.gain.value =
          0.00001;


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime +
          0.02
        );


        audioEnabled = true;


        audioButton.textContent =
          "AUDIO ON";


        audioButton.classList.remove(
          "visible"
        );


        audioButton.classList.add(
          "enabled"
        );

      }

      catch (error) {

        console.error(
          "Audio initialization error:",
          error
        );

      }

    }


    audioButton.addEventListener(
      "click",
      enableAudio
    );


    /*
     * ==========================================================
     * SUCCESS SOUND
     * ==========================================================
     */

    function playValidSound() {

      if (!audioEnabled) {
        return;
      }


      if (!audioContext) {
        return;
      }


      const now =
        audioContext.currentTime;


      const oscillator =
        audioContext.createOscillator();


      const gain =
        audioContext.createGain();


      oscillator.type =
        "sine";


      oscillator.frequency.setValueAtTime(
        660,
        now
      );


      oscillator.frequency.setValueAtTime(
        880,
        now + 0.11
      );


      gain.gain.setValueAtTime(
        0.0001,
        now
      );


      gain.gain.exponentialRampToValueAtTime(
        0.18,
        now + 0.015
      );


      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.28
      );


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start(
        now
      );


      oscillator.stop(
        now + 0.3
      );

    }


    /*
     * ==========================================================
     * REJECT SOUND
     * ==========================================================
     */

    function playRejectSound() {

      if (!audioEnabled) {
        return;
      }


      if (!audioContext) {
        return;
      }


      const now =
        audioContext.currentTime;


      const oscillator =
        audioContext.createOscillator();


      const gain =
        audioContext.createGain();


      oscillator.type =
        "square";


      oscillator.frequency.setValueAtTime(
        260,
        now
      );


      oscillator.frequency.setValueAtTime(
        150,
        now + 0.12
      );


      oscillator.frequency.setValueAtTime(
        110,
        now + 0.24
      );


      gain.gain.setValueAtTime(
        0.0001,
        now
      );


      gain.gain.exponentialRampToValueAtTime(
        0.11,
        now + 0.01
      );


      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.1
      );


      gain.gain.setValueAtTime(
        0.0001,
        now + 0.14
      );


      gain.gain.exponentialRampToValueAtTime(
        0.11,
        now + 0.15
      );


      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.34
      );


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start(
        now
      );


      oscillator.stop(
        now + 0.36
      );

    }


    /*
     * ==========================================================
     * LOADING
     * ==========================================================
     */

    function setLoading(
      active
    ) {

      requestInProgress =
        active;


      loading.classList.toggle(
        "visible",
        active
      );


      if (active) {

        scannerStatus.textContent =
          "VERIFICA INGRESSO...";

      }

      else {

        scannerStatus.textContent =
          "PRONTO — INQUADRA IL PROSSIMO QR";

      }

    }


    /*
     * ==========================================================
     * DATE
     * ==========================================================
     */

    function formatDateTime(
      value
    ) {

      if (!value) {
        return "—";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date.toLocaleString(
        "it-IT",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
     * ==========================================================
     * HTML ESCAPE
     * ==========================================================
     */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /*
     * ==========================================================
     * PARTECIPANTI — STATISTICHE
     * ==========================================================
     */

    async function loadParticipantStats() {

      try {

        const response =
          await fetch(
            STATS_RPC_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
              },

              body:
                JSON.stringify({}),

              cache:
                "no-store"
            }
          );


        if (!response.ok) {

          console.error(
            "Participant stats error:",
            await response.text()
          );

          return;

        }


        const data =
          await response.json();


        const total =
          Number(
            data?.total || 0
          );


        const entered =
          Number(
            data?.entered || 0
          );


        participantStats.textContent =
          `${entered} / ${total}`;

      }

      catch (error) {

        console.error(
          "Participant stats error:",
          error
        );

      }

    }


    /*
     * ==========================================================
     * SEARCH
     * ==========================================================
     */

    function clearSearchResults() {

      searchResults.innerHTML = "";

    }


    function renderSearchResults(
      participants
    ) {

      clearSearchResults();


      if (
        !Array.isArray(
          participants
        ) ||
        participants.length === 0
      ) {

        searchResults.innerHTML = `
          <div class="search-empty">
            NESSUN PARTECIPANTE TROVATO
          </div>
        `;

        return;

      }


      participants.forEach(
        person => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "search-item";


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "search-item-name";


          name.textContent =
            `${person.first_name || ""} ${person.last_name || ""}`
              .trim();


          const right =
            document.createElement(
              "div"
            );

          right.className =
            "search-item-right";


          const status =
            document.createElement(
              "div"
            );


          const used =
            person.ticket_status ===
            "USED" ||
            Boolean(
              person.used_at
            );


          status.className =
            used
              ? "search-item-status used"
              : "search-item-status";


          status.textContent =
            used
              ? "GIÀ ENTRATO"
              : "ISCRITTO — NON ANCORA ENTRATO";


          right.appendChild(
            status
          );


          if (used && person.used_at) {

            const time =
              document.createElement(
                "div"
              );

            time.className =
              "search-item-time";

            time.textContent =
              formatDateTime(
                person.used_at
              );

            right.appendChild(
              time
            );

          }


          item.appendChild(
            name
          );

          item.appendChild(
            right
          );


          searchResults.appendChild(
            item
          );

        }
      );

    }


    async function searchParticipants() {

      const query =
        String(
          searchInput.value || ""
        ).trim();


      clearSearchResults();


      if (query.length < 2) {

        searchStatus.textContent =
          "INSERISCI ALMENO 2 CARATTERI";

        return;

      }


      searchStatus.textContent =
        "RICERCA...";


      searchButton.disabled =
        true;


      try {

        const response =
          await fetch(
            SEARCH_RPC_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
              },

              body:
                JSON.stringify({
                  p_query:
                    query
                }),

              cache:
                "no-store"
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          console.error(
            "Search error:",
            data
          );

          searchStatus.textContent =
            "ERRORE DI RICERCA";

          return;

        }


        if (
          !Array.isArray(data) ||
          data.length === 0
        ) {

          searchStatus.textContent =
            "NESSUN RISULTATO";

        }

        else {

          searchStatus.textContent =
            `${data.length} RISULTAT${data.length === 1 ? "O" : "I"}`;

        }


        renderSearchResults(
          data
        );

      }

      catch (error) {

        console.error(
          "Search participants error:",
          error
        );

        searchStatus.textContent =
          "ERRORE DI CONNESSIONE";

      }

      finally {

        searchButton.disabled =
          false;

      }

    }


    searchButton.addEventListener(
      "click",
      searchParticipants
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          searchParticipants();

        }

      }
    );


    /*
     * ==========================================================
     * RESULT
     * ==========================================================
     */

    function showResult(
      data
    ) {

      result.classList.remove(
        "valid",
        "already",
        "invalid"
      );


      result.classList.add(
        "visible"
      );


      if (
        data.result ===
        "VALID"
      ) {

        result.classList.add(
          "valid"
        );


        resultCode.textContent =
          "✓ ACCESSO CONSENTITO";


        playValidSound();

      }

      else if (
        data.result ===
        "ALREADY_USED"
      ) {

        result.classList.add(
          "already"
        );


        resultCode.textContent =
          "⚠ BIGLIETTO GIÀ UTILIZZATO";


        playRejectSound();

      }

      else {

        result.classList.add(
          "invalid"
        );


        resultCode.textContent =
          "✕ QR NON VALIDO";


        playRejectSound();

      }


      const person =
        data.participant;


      if (person) {

        participant.textContent =
          `${person.first_name || ""} ${person.last_name || ""}`
            .trim();

      }

      else {

        participant.textContent =
          "TICKET NON RICONOSCIUTO";

      }


      const event =
        data.event;


      if (event) {

        details.innerHTML = `
          <strong>${escapeHtml(event.name)}</strong><br>
          ${escapeHtml(event.location)}<br>
          ${escapeHtml(event.date)}
          ${
            data.used_at
              ? `<br>INGRESSO: ${escapeHtml(
                  formatDateTime(
                    data.used_at
                  )
                )}`
              : ""
          }
        `;

      }

      else {

        details.textContent =
          data.message ||
          "QR NON VALIDO";

      }

    }


    /*
     * ==========================================================
     * RPC DIRETTA
     * ==========================================================
     */

    async function checkTicket(
      token
    ) {

      const cleanToken =
        String(
          token || ""
        ).trim();


      if (!cleanToken) {
        return;
      }


      if (requestInProgress) {
        return;
      }


      setLoading(true);


      const startedAt =
        performance.now();


      try {

        const response =
          await fetch(
            RPC_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
              },

              body: JSON.stringify({
                p_ticket_token:
                  cleanToken
              }),

              cache: "no-store"
            }
          );


        const data =
          await response.json();


        const elapsed =
          Math.round(
            performance.now() -
            startedAt
          );


        console.log(
          `Ticket check: ${elapsed} ms`,
          data
        );


        if (!response.ok) {

          showResult({
            result: "INVALID",
            message:
              data?.message ||
              "ERRORE SERVER"
          });

          return;

        }


        showResult(
          data
        );


        /*
         * Se il QR è stato accettato,
         * aggiorniamo immediatamente
         * il contatore Entrati / Totali.
         */

        if (
          data.result ===
          "VALID"
        ) {

          loadParticipantStats();

        }

      }

      catch (error) {

        console.error(
          "Ticket check error:",
          error
        );


        showResult({
          result: "INVALID",
          message:
            "ERRORE DI CONNESSIONE"
        });

      }

      finally {

        setLoading(false);

      }

    }


    /*
     * ==========================================================
     * QR SCAN
     * ==========================================================
     *
     * IMPORTANTE:
     * NON fermiamo più la fotocamera.
     */

    async function onScanSuccess(
      decodedText
    ) {

      if (requestInProgress) {
        return;
      }


      const token =
        String(
          decodedText || ""
        ).trim();


      if (!token) {
        return;
      }


      const now =
        Date.now();


      /*
       * Se lo stesso QR è ancora
       * davanti alla camera, lo ignoriamo.
       */

      if (
        token ===
          lastScannedToken &&
        now - lastScanTime <
          SAME_QR_COOLDOWN
      ) {

        return;

      }


      lastScannedToken =
        token;


      lastScanTime =
        now;


      /*
       * LA CAMERA RESTA ATTIVA.
       */

      await checkTicket(
        token
      );

    }


    function onScanFailure() {

      /*
       * Normale:
       * molti frame non contengono
       * un QR leggibile.
       */

    }


    /*
     * ==========================================================
     * START CAMERA
     * ==========================================================
     */

    async function startScanner() {

      if (
        scannerRunning
      ) {

        return;

      }


      try {

        html5QrCode =
          new Html5Qrcode(
            "reader"
          );


        /*
         * Proviamo direttamente
         * la camera posteriore.
         */

        await html5QrCode.start(

          {
            facingMode:
              {
                exact:
                  "environment"
              }
          },

          {
            fps: 15,

            qrbox:
              function(
                width,
                height
              ) {

                const size =
                  Math.floor(
                    Math.min(
                      width,
                      height
                    ) * 0.68
                  );


                return {
                  width:
                    size,
                  height:
                    size
                };

              },

            aspectRatio:
              1.0

          },

          onScanSuccess,

          onScanFailure

        );


        scannerRunning =
          true;


        scannerStatus.textContent =
          "PRONTO — INQUADRA IL QR";


      }

      catch (error) {

        console.error(
          "Camera error:",
          error
        );


        /*
         * Fallback per browser
         * che non supportano exact.
         */

        try {

          if (
            html5QrCode
          ) {

            try {

              await html5QrCode.clear();

            }

            catch (_) {}

          }


          html5QrCode =
            new Html5Qrcode(
              "reader"
            );


          await html5QrCode.start(

            {
              facingMode:
                "environment"
            },

            {
              fps: 15,

              qrbox:
                function(
                  width,
                  height
                ) {

                  const size =
                    Math.floor(
                      Math.min(
                        width,
                        height
                      ) * 0.68
                    );


                  return {
                    width:
                      size,
                    height:
                      size
                  };

                },

              aspectRatio:
                1.0

            },

            onScanSuccess,

            onScanFailure

          );


          scannerRunning =
            true;


          scannerStatus.textContent =
            "PRONTO — INQUADRA IL QR";


        }

        catch (
          fallbackError
        ) {

          console.error(
            "Camera fallback error:",
            fallbackError
          );


          scannerStatus.textContent =
            "FOTOCAMERA NON DISPONIBILE";

        }

      }

    }


    /*
     * ==========================================================
     * RESET RISULTATO
     * ==========================================================
     *
     * NON riavvia la camera.
     * È già accesa.
     */

    resetButton.addEventListener(
      "click",
      () => {

        result.classList.remove(
          "visible"
        );


        resultCode.textContent =
          "—";


        participant.textContent =
          "—";


        details.textContent =
          "—";


        scannerStatus.textContent =
          "PRONTO — INQUADRA IL PROSSIMO QR";

      }
    );


    /*
     * ==========================================================
     * AVVIO
     * ==========================================================
     */

    startScanner();


    /*
     * Caricamento iniziale
     * del contatore.
     */

    loadParticipantStats();


    /*
     * Aggiornamento automatico
     * ogni 10 secondi.
     */

    setInterval(
      loadParticipantStats,
      10000
    );

  </script>
