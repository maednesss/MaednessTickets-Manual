<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MÆDNESS® — PARTECIPANTI</title>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --red: #ff0000;
      --black: #050505;
      --white: #ffffff;
      --green: #20d878;
      --orange: #ff9d00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100svh;
      padding: 18px;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      min-height: calc(100svh - 36px);
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================
       TOP
       ========================================================== */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 26px;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .brand span {
      font-size: 11px;
      vertical-align: top;
      margin-left: 2px;
    }

    .top-label {
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: right;
      line-height: 1.4;
    }

    /* ==========================================================
       TITLE
       ========================================================== */

    .title {
      margin: 0 0 8px;
      font-size: clamp(48px, 16vw, 86px);
      line-height: 0.84;
      letter-spacing: -0.07em;
      font-weight: 900;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    /* ==========================================================
       TOTAL
       ========================================================== */

    .total-box {
      border-top: 1px solid #292929;
      border-bottom: 1px solid #292929;
      padding: 16px 0;
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .total-label {
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .total-number {
      color: var(--white);
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .total-caption {
      color: var(--red);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    /* ==========================================================
       SEARCH
       ========================================================== */

    .search-section {
      margin-bottom: 14px;
    }

    .search-label {
      display: block;
      margin-bottom: 9px;
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      border: 1px solid #292929;
      outline: none;
      background: #000;
      color: var(--white);
      padding: 0 13px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 0;
    }

    .search-input::placeholder {
      color: #555;
    }

    .search-input:focus {
      border-color: var(--red);
    }

    .search-button {
      width: 88px;
      height: 46px;
      border: 1px solid var(--red);
      background: var(--red);
      color: var(--white);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    .search-button:disabled {
      opacity: 0.5;
    }

    .search-status {
      min-height: 16px;
      margin-top: 8px;
      color: #666;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ==========================================================
       PDF BUTTON
       ========================================================== */

    .pdf-button {
      width: 100%;
      height: 46px;
      margin-bottom: 24px;
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
      cursor: pointer;
      text-transform: uppercase;
    }

    .pdf-button:active {
      background: var(--red);
      color: var(--white);
    }

    .pdf-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* ==========================================================
       LIST
       ========================================================== */

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .list-header-label {
      color: #777;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .list-header-count {
      color: var(--red);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    .participants-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .participant-item {
      border: 1px solid #292929;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .participant-number {
      width: 28px;
      flex-shrink: 0;
      color: #444;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .participant-info {
      flex: 1;
      min-width: 0;
    }

    .participant-name {
      color: var(--white);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .participant-date {
      margin-top: 5px;
      color: #555;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .participant-status {
      flex-shrink: 0;
      text-align: right;
      color: var(--green);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .participant-status.used {
      color: var(--orange);
    }

    .participant-status-time {
      margin-top: 4px;
      color: #555;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .empty {
      padding: 30px 0;
      text-align: center;
      color: #555;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    .loading {
      padding: 30px 0;
      text-align: center;
      color: var(--white);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    /* ==========================================================
       FOOTER
       ========================================================== */

    .footer {
      margin-top: auto;
      padding-top: 30px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #444;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    @media (max-width: 380px) {

      body {
        padding: 14px;
      }

      .page {
        min-height: calc(100svh - 28px);
      }

      .participant-item {
        padding: 11px;
      }

      .participant-name {
        font-size: 13px;
      }

    }
  </style>
</head>

  <script>

    /* ==========================================================
       SUPABASE
       ========================================================== */

    const SUPABASE_URL =
      "https://rmniojqexlasxfxisqbm.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_SbqTxagdWxbf9QjnMzKQsg_E_aCGvm-";


    const PARTICIPANTS_RPC_URL =
      `${SUPABASE_URL}/rest/v1/rpc/get_participants_list`;


    /* ==========================================================
       ELEMENTI
       ========================================================== */

    const totalNumber =
      document.getElementById(
        "totalNumber"
      );


    const listHeaderCount =
      document.getElementById(
        "listHeaderCount"
      );


    const participantsList =
      document.getElementById(
        "participantsList"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchButton =
      document.getElementById(
        "searchButton"
      );


    const searchStatus =
      document.getElementById(
        "searchStatus"
      );


    const pdfButton =
      document.getElementById(
        "pdfButton"
      );


    /* ==========================================================
       DATA
       ========================================================== */

    let allParticipants = [];


    /* ==========================================================
       DATE
       ========================================================== */

    function formatDateTime(
      value
    ) {

      if (!value) {
        return "—";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date.toLocaleString(
        "it-IT",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* ==========================================================
       RENDER LIST
       ========================================================== */

    function renderParticipants(
      participants
    ) {

      participantsList.innerHTML = "";


      listHeaderCount.textContent =
        participants.length;


      if (
        participants.length === 0
      ) {

        participantsList.innerHTML = `
          <div class="empty">
            NESSUN PARTECIPANTE TROVATO
          </div>
        `;

        return;

      }


      participants.forEach(
        (
          person,
          index
        ) => {

          const used =
            person.ticket_status ===
            "USED" ||
            Boolean(
              person.used_at
            );


          const item =
            document.createElement(
              "div"
            );

          item.className =
            "participant-item";


          const number =
            document.createElement(
              "div"
            );

          number.className =
            "participant-number";


          number.textContent =
            String(
              index + 1
            ).padStart(
              2,
              "0"
            );


          const info =
            document.createElement(
              "div"
            );

          info.className =
            "participant-info";


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "participant-name";


          name.textContent =
            `${person.first_name || ""} ${person.last_name || ""}`
              .trim();


          const registrationDate =
            document.createElement(
              "div"
            );

          registrationDate.className =
            "participant-date";


          registrationDate.textContent =
            person.created_at
              ? `ISCRIZIONE: ${formatDateTime(
                  person.created_at
                )}`
              : "ISCRIZIONE";


          info.appendChild(
            name
          );


          info.appendChild(
            registrationDate
          );


          const statusBox =
            document.createElement(
              "div"
            );


          const status =
            document.createElement(
              "div"
            );


          status.className =
            used
              ? "participant-status used"
              : "participant-status";


          status.textContent =
            used
              ? "ENTRATO"
              : "ISCRITTO";


          statusBox.appendChild(
            status
          );


          if (
            used &&
            person.used_at
          ) {

            const usedTime =
              document.createElement(
                "div"
              );

            usedTime.className =
              "participant-status-time";


            usedTime.textContent =
              formatDateTime(
                person.used_at
              );


            statusBox.appendChild(
              usedTime
            );

          }


          item.appendChild(
            number
          );

          item.appendChild(
            info
          );

          item.appendChild(
            statusBox
          );


          participantsList.appendChild(
            item
          );

        }
      );

    }


    /* ==========================================================
       LOAD PARTICIPANTS
       ========================================================== */

    async function loadParticipants() {

      participantsList.innerHTML = `
        <div class="loading">
          CARICAMENTO LISTA...
        </div>
      `;


      try {

        const response =
          await fetch(
            PARTICIPANTS_RPC_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
              },

              body:
                JSON.stringify({}),

              cache:
                "no-store"
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          console.error(
            "Participants error:",
            data
          );


          participantsList.innerHTML = `
            <div class="empty">
              ERRORE CARICAMENTO LISTA
            </div>
          `;

          return;

        }


        allParticipants =
          Array.isArray(data)
            ? data
            : [];


        totalNumber.textContent =
          allParticipants.length;


        renderParticipants(
          allParticipants
        );

      }

      catch (error) {

        console.error(
          "Participants error:",
          error
        );


        participantsList.innerHTML = `
          <div class="empty">
            ERRORE DI CONNESSIONE
          </div>
        `;

      }

    }


    /* ==========================================================
       SEARCH
       ========================================================== */

    function searchParticipants() {

      const query =
        String(
          searchInput.value || ""
        )
          .trim()
          .toLowerCase();


      if (!query) {

        searchStatus.textContent =
          "";

        renderParticipants(
          allParticipants
        );

        return;

      }


      const filtered =
        allParticipants.filter(
          person => {

            const firstName =
              String(
                person.first_name || ""
              )
                .toLowerCase();


            const lastName =
              String(
                person.last_name || ""
              )
                .toLowerCase();


            const fullName =
              `${firstName} ${lastName}`;


            return (
              firstName.includes(
                query
              ) ||
              lastName.includes(
                query
              ) ||
              fullName.includes(
                query
              )
            );

          }
        );


      searchStatus.textContent =
        `${filtered.length} RISULTAT${filtered.length === 1 ? "O" : "I"}`;


      renderParticipants(
        filtered
      );

    }


    /* ==========================================================
       PDF
       ========================================================== */

    function downloadPdf() {

      if (
        !Array.isArray(
          allParticipants
        ) ||
        allParticipants.length === 0
      ) {

        alert(
          "NESSUN PARTECIPANTE DISPONIBILE"
        );

        return;

      }


      if (
        !window.jspdf ||
        !window.jspdf.jsPDF
      ) {

        alert(
          "IMPOSSIBILE CREARE IL PDF"
        );

        return;

      }


      const {
        jsPDF
      } = window.jspdf;


      /*
       * IMPORTANTE:
       * il PDF usa SEMPRE tutta la lista,
       * anche se è attiva una ricerca.
       */

      const participants =
        [...allParticipants]
          .sort(
            (
              a,
              b
            ) => {

              const lastA =
                String(
                  a.last_name || ""
                );

              const lastB =
                String(
                  b.last_name || ""
                );


              const lastCompare =
                lastA.localeCompare(
                  lastB,
                  "it",
                  {
                    sensitivity:
                      "base"
                  }
                );


              if (
                lastCompare !== 0
              ) {

                return lastCompare;

              }


              return String(
                a.first_name || ""
              ).localeCompare(
                String(
                  b.first_name || ""
                ),
                "it",
                {
                  sensitivity:
                    "base"
                }
              );

            }
          );


      const doc =
        new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4"
        });

      const pageHeight =

        0
      );

      doc.setFontSize(
        8
      );

      doc.text(
        "ENTRY CONTROL",
        pageWidth - margin,
        16,
        {
          align: "right"
        }
      );


      doc.text(
        "18.10.2026",
        pageWidth - margin,
        21,
        {
          align: "right"
        }
      );


      doc.setTextColor(
        255,
        255,
        255
      );

      doc.setFontSize(
        25
      );

      doc.text(
        "PARTECIPANTI",
        margin,
        38
      );


      doc.setTextColor(
        255,
        0,
        0
      );

      doc.setFontSize(
        8
      );

      doc.text(
        "ROTAROTT / FOGGIA / ITALY",
        margin,
        45
      );


      /* ========================================================

      doc.setDrawColor(
        50,

      );

      doc.line(

      doc.line(

      );


      doc.setTextColor(

      );

      doc.text(

      doc.setTextColor(
        255,
        255,
        255
      );

      doc.setFontSize(
        17

      doc.text(
        String(

        margin + 22,
        59
      );


      doc.setTextColor(
        255,
        0,
        0
      );

      doc.setFontSize(
        7
      );

      doc.text(
        "ISCRITTI",
        margin + 38,
        57
      );


      /* ========================================================
         TABLE HEADER
         ======================================================== */

      let y = 73;


      doc.setTextColor(
        120,
        120,
        120
      );

      doc.setFontSize(
        7
      );

      doc.text(
        "#",
        margin,
        y
      );

      doc.text(
        "COGNOME NOME",
        margin + 12,
        y
      );

      doc.text(
        "STATO",
        pageWidth - margin,
        y,
        {
          align: "right"
        }
      );


      y += 5;


      doc.setDrawColor(
        45,
        45,
        45
      );

      doc.line(
        margin,
        y,
        pageWidth - margin,
        y
      );


      y += 7;


      /* ========================================================
         ROWS
         ======================================================== */

      participants.forEach(
        (
          person,
          index
        ) => {

          if (
            y > pageHeight - 22
          ) {

            addPdfFooter(

            );

            doc.addPage();

              5,
              5
            );

            doc.rect(
              0,
              0,
              pageWidth,
              pageHeight,
              "F"
            );


            y = 20;


            doc.setTextColor(
              255,
              255,
              255
            );

            doc.setFontSize(
              13
            );

            doc.text(
              "MÆDNESS® / PARTECIPANTI",
              margin,
              y
            );


            y += 12;

          }


          const used =
            person.ticket_status ===
            "USED" ||
            Boolean(
              person.used_at
            );


          const fullName =
            `${person.last_name || ""} ${person.first_name || ""}`
              .trim()
              .toUpperCase();


          doc.setTextColor(
            70,
            70,
            70
          );

          doc.setFontSize(
            7

          doc.text(
            String(
              index + 1
            ).padStart(
              2,
              "0"

            margin,

          doc.setTextColor(
            255,
            255,
            255

          doc.setFontSize(
            8
          );

          doc.text(
            fullName,
            margin + 12,
            y
          );


          doc.setTextColor(
            used
              ? 255
              : 32,
            used
              ? 157
              : 216,
            used
              ? 0
              : 120
          );

          doc.setFontSize(
            7
          );

          doc.text(
            used
              ? "ENTRATO"
              : "ISCRITTO",
            pageWidth - margin,
            y,
            {
              align: "right"
            }
          );


          y += 7;


          doc.setDrawColor(
            30,
            30,
            30
          );

          doc.line(
            margin,
            y,
            pageWidth - margin,
            y
          );


          y += 5;

        }
      );


      /* ========================================================
         FOOTER
         ======================================================== */

      addPdfFooter(
        doc,
        pageWidth,
        pageHeight
      );


      /* ========================================================
         DOWNLOAD
         ======================================================== */

      const now =
        new Date();


      const date =
        [
          now.getFullYear(),
          String(
            now.getMonth() + 1
          ).padStart(
            2,
            "0"
          ),
          String(
            now.getDate()
          ).padStart(
            2,
            "0"
          )
        ].join("");


      doc.save(
        `MAEDNESS_ROTAROTT_PARTECIPANTI_${date}.pdf`
      );

    }


    /* ==========================================================
       PDF FOOTER
       ========================================================== */

    function addPdfFooter(
      doc,
      pageWidth,
      pageHeight
    ) {

      doc.setTextColor(
        80,
        80,
        80
      );

      doc.setFont(
        "helvetica",
        "normal"
      );

      doc.setFontSize(
        6
      );


      doc.text(
        "MÆDNESS® / ROTAROTT / FOGGIA / ITALY",
        15,
        pageHeight - 10
      );


      const pageNumber =
        doc.internal.getNumberOfPages();


      doc.text(
        `PAGE ${pageNumber}`,
        pageWidth - 15,
        pageHeight - 10,
        {
          align: "right"
        }
      );

    }


    /* ==========================================================
       EVENTS
       ========================================================== */

    searchButton.addEventListener(
      "click",
      searchParticipants
    );


    searchInput.addEventListener(
      "input",
      searchParticipants
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          searchParticipants();

        }

      }
    );


    pdfButton.addEventListener(
      "click",
      downloadPdf
    );


    /* ==========================================================
       START
       ========================================================== */

    loadParticipants();


    setInterval(
      loadParticipants,
      10000
    );

  </script>

</body>
</html>
